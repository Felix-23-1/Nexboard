server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker-interner DNS-Resolver – erzwingt Re-Auflösung alle 10s.
    # Verhindert Bad Gateway wenn der backend-Container neu startet und
    # eine neue IP bekommt (ohne diesen Fix cached nginx die alte IP ewig).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP-API
    location /api/ {
        # Variable statt direktem Hostname → nginx nutzt den Resolver oben
        # und löst vor jeder Verbindung neu auf statt nur einmalig beim Start.
        # WICHTIG: kein Pfad in der Variable – nginx hängt dann den originalen
        # Request-URI an (z.B. /api/auth/login → backend:8000/api/auth/login).
        set $backend http://backend:8000;
        proxy_pass $backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket-Unterstützung (SSH-Terminal)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Verbindungs-Timeout: schnell scheitern statt 60s hängen
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Bei Verbindungsfehler oder Timeout einmal retry
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 6s;
    }

    # React SPA – alle anderen Routen auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
